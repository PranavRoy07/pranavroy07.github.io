<circle r="80" fill="#FF4FD8" opacity=".28" filter="url(#blur)"><animate attributeName="cx" values="900;120;900" dur="16s" repeatCount="indefinite"/><animate attributeName="cy" values="270;40;270" dur="13s" repeatCount="indefinite"/></circle>
