<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340" role="img" aria-label="Pranav Roy - BBACA Graduate, Software Engineer, Data Analyst, AI Builder">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#050816"><animate attributeName="stop-color" values="#050816;#0b1030;#050816" dur="8s" repeatCount="indefinite"/></stop><stop offset="1" stop-color="#0a1a2f"><animate attributeName="stop-color" values="#0a1a2f;#1a0a2f;#0a1a2f" dur="8s" repeatCount="indefinite"/></stop></linearGradient>
<linearGradient id="name" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect"><stop offset="0" stop-color="#00E5CC"/><stop offset=".5" stop-color="#7C6CFF"/><stop offset="1" stop-color="#FF4FD8"/><animateTransform attributeName="gradientTransform" type="translate" values="-0.4 0;0.4 0;-0.4 0" dur="6s" repeatCount="indefinite"/></linearGradient>
<linearGradient id="ring" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFC857"/><stop offset=".25" stop-color="#FF4FD8"/><stop offset=".5" stop-color="#7C6CFF"/><stop offset=".75" stop-color="#00E5CC"/><stop offset="1" stop-color="#7CFFB2"/></linearGradient>
<filter id="glow" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
