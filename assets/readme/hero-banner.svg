<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#00E5CC" stroke-opacity=".07"/></pattern>
<clipPath id="round"><rect width="1000" height="340" rx="22"/></clipPath>
